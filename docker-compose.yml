services:
  # ==========================================
  # 1. Frontend Service (React + Vite)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - enterprise-net

  # ==========================================
  # 2. Core API & Orchestration Service (FastAPI)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=godlevelpassword
    depends_on:
      - kafka
      - neo4j
    networks:
      - enterprise-net
    volumes:
      - ./data:/app/data

  # ==========================================
  # 3. Event Bus (Apache Kafka + Zookeeper)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - enterprise-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - enterprise-net

  # ==========================================
  # 4. Graph Database (Neo4j for Attribution)
  # ==========================================
  neo4j:
    image: neo4j:5.12.0
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/godlevelpassword
    volumes:
      - neo4j_data:/data
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge

volumes:
  neo4j_data:
